<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Cas d’utilisation de Pause Empathique</title>
<desc id="desc">Un visiteur peut pratiquer sans compte, créer un compte ou se connecter. Un utilisateur connecté peut pratiquer avec compte, consulter son journal et ses pauses, supprimer une pause, consulter ou modifier ses informations, supprimer son compte et se déconnecter. Pratiquer avec compte inclut l'enregistrement de la pause à la finalisation.</desc>
<defs><marker id="include-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#725000" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#1a1300}.label{font-size:20px}.actor-label{font-size:19px;font-weight:bold}.association{stroke:#887c62;stroke-width:1.6;fill:none}.actor{stroke:#1a1300;stroke-width:2.5;fill:none}</style>
<rect x="130" y="4" width="940" height="560" rx="0" fill="#fffaf0" stroke="#a99771" stroke-width="1.5"/>
<text x="600" y="27" text-anchor="middle" font-size="18" font-weight="bold">Pause Empathique</text>
<path class="association" d="M85 298 L205 195"/>
<path class="association" d="M85 298 L205 325"/>
<path class="association" d="M85 298 L205 455"/>
<path class="association" d="M1115 298 L1000 65"/>
<path class="association" d="M1115 298 L1000 130"/>
<path class="association" d="M1115 298 L1000 195"/>
<path class="association" d="M1115 298 L1000 260"/>
<path class="association" d="M1115 298 L1000 325"/>
<path class="association" d="M1115 298 L1000 390"/>
<path class="association" d="M1115 298 L1000 455"/>
<path class="association" d="M1115 298 L1000 520"/>
<path d="M690 65 H515" fill="none" stroke="#725000" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#include-arrow)"/>
<text x="602" y="52" text-anchor="middle" font-size="16">«include»</text>
<g id="save"><ellipse cx="360" cy="65" rx="155" ry="25" fill="#ffffff" stroke="#a58b52" stroke-width="1.5"/>
<text class="label" x="360" y="72" text-anchor="middle">Enregistrer une pause</text>
</g>
<g id="anonymous"><ellipse cx="360" cy="195" rx="155" ry="25" fill="#ffdc7d" stroke="#a58b52" stroke-width="1.5"/>
<text class="label" x="360" y="202" text-anchor="middle">Pratiquer sans compte</text>
</g>
<g id="register"><ellipse cx="360" cy="325" rx="155" ry="25" fill="#ffffff" stroke="#a58b52" stroke-width="1.5"/>
<text class="label" x="360" y="332" text-anchor="middle">Créer un compte</text>
</g>
<g id="login"><ellipse cx="360" cy="455" rx="155" ry="25" fill="#ffffff" stroke="#a58b52" stroke-width="1.5"/>
<text class="label" x="360" y="462" text-anchor="middle">Se connecter</text>
</g>
<g id="practice"><ellipse cx="845" cy="65" rx="155" ry="25" fill="#ffdc7d" stroke="#a58b52" stroke-width="1.5"/>
<text class="label" x="845" y="72" text-anchor="middle">Pratiquer avec compte</text>
</g>
<g id="diary"><ellipse cx="845" cy="130" rx="155" ry="25" fill="#ffffff" stroke="#a58b52" stroke-width="1.5"/>
<text class="label" x="845" y="137" text-anchor="middle">Consulter son journal</text>
</g>
<g id="detail"><ellipse cx="845" cy="195" rx="155" ry="25" fill="#ffffff" stroke="#a58b52" stroke-width="1.5"/>
<text class="label" x="845" y="202" text-anchor="middle">Consulter une pause</text>
</g>
<g id="delete"><ellipse cx="845" cy="260" rx="155" ry="25" fill="#ffffff" stroke="#a58b52" stroke-width="1.5"/>
<text class="label" x="845" y="267" text-anchor="middle">Supprimer une pause</text>
</g>
<g id="profile"><ellipse cx="845" cy="325" rx="155" ry="25" fill="#ffffff" stroke="#a58b52" stroke-width="1.5"/>
<text class="label" x="845" y="332" text-anchor="middle">Consulter ses informations</text>
</g>
<g id="update"><ellipse cx="845" cy="390" rx="155" ry="25" fill="#ffffff" stroke="#a58b52" stroke-width="1.5"/>
<text class="label" x="845" y="397" text-anchor="middle">Modifier ses informations</text>
</g>
<g id="account"><ellipse cx="845" cy="455" rx="155" ry="25" fill="#ffffff" stroke="#a58b52" stroke-width="1.5"/>
<text class="label" x="845" y="462" text-anchor="middle">Supprimer son compte</text>
</g>
<g id="logout"><ellipse cx="845" cy="520" rx="155" ry="25" fill="#ffffff" stroke="#a58b52" stroke-width="1.5"/>
<text class="label" x="845" y="527" text-anchor="middle">Se déconnecter</text>
</g>
<g class="actor"><circle cx="60" cy="260" r="14"/><path d="M60 274 V326 M35 298 H85 M60 326 L37 362 M60 326 L83 362"/></g>
<text class="actor-label" x="60" y="389" text-anchor="middle">Visiteur</text>
<g class="actor"><circle cx="1140" cy="260" r="14"/><path d="M1140 274 V326 M1115 298 H1165 M1140 326 L1117 362 M1140 326 L1163 362"/></g>
<text class="actor-label" x="1140" y="389" text-anchor="middle">Utilisateur</text>
<text class="actor-label" x="1140" y="412" text-anchor="middle">connecté</text>
</svg>
